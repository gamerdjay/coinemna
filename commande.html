<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Les commandes de Emna</title>
  
  <!-- Configuration pour Web App iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Commandes Emna">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #fb00bd;
      display: flex;
      justify-content: center;
      padding: 40px 15px;
      margin: 0;
    }

    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-top: 0;
      margin-bottom: 25px;
      font-size: 1.8rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }

    textarea {
      width: 100%;
      height: 90px;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: vertical;
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: #ff6b81;
    }

    button.btn-add {
      background-color: #ff6b81;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button.btn-add:hover {
      background-color: #ff4757;
    }

    h2 {
      color: #555;
      font-size: 1.3rem;
      border-bottom: 2px solid #f0f0f0;
      padding-bottom: 8px;
    }

    .order-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .order-item {
      background-color: #fafafa;
      border: 1px solid #eaeaea;
      padding: 12px 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      word-break: break-word;
    }

    .order-text {
      color: #2c3e50;
      font-size: 0.95rem;
      flex-grow: 1;
      padding-right: 10px;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ff4757;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .delete-btn:hover {
      background-color: #ffe0e3;
    }

    .empty-msg {
      text-align: center;
      color: #888;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Les commandes de Emna</h1>

    <!-- Formulaire d'ajout de commande -->
    <div class="form-group">
      <textarea id="orderInput" placeholder="Écrivez votre commande ici..."></textarea>
      <button class="btn-add" id="submitBtn">Valider la commande</button>
    </div>

    <!-- Zone d'affichage des commandes en cours -->
    <h2>Commandes en cours</h2>
    <ul class="order-list" id="ordersList">
      <li class="empty-msg">Chargement des commandes...</li>
    </ul>
  </div>

  <!-- Firebase JavaScript SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      deleteDoc, 
      doc, 
      onSnapshot, 
      serverTimestamp, 
      query, 
      orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD00HecbfOqkgB7MqjI7eXk9ujXzO1d30U",
      authDomain: "confiture-emna.firebaseapp.com",
      projectId: "confiture-emna",
      storageBucket: "confiture-emna.firebasestorage.app",
      messagingSenderId: "1091953479191",
      appId: "1:1091953479191:web:a7ecb6bc756e7aded31652",
      measurementId: "G-T7M8R5RPW6"
    };

    // Initialisation Firebase & Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const ordersRef = collection(db, "commandes");

    // Lien Webhook Pushcut
    const pushcutUrl = "https://api.pushcut.io/sjQ17NXv83FiaxX2uv7W4/notifications/Commande";

    const orderInput = document.getElementById("orderInput");
    const submitBtn = document.getElementById("submitBtn");
    const ordersList = document.getElementById("ordersList");

    // 1. Ajouter une nouvelle commande et déclencher Pushcut
    async function addOrder() {
      const text = orderInput.value.trim();
      if (!text) {
        alert("Veuillez écrire une commande avant de valider.");
        return;
      }

      try {
        // Enregistrement Firestore
        await addDoc(ordersRef, {
          texte: text,
          createdAt: serverTimestamp()
        });

        // Envoi simple pour déclencher la notification Pushcut gratuite
        fetch(pushcutUrl, {
          method: "POST"
        }).catch(err => console.error("Erreur Pushcut:", err));

        orderInput.value = "";
      } catch (error) {
        console.error("Erreur lors de l'ajout : ", error);
        alert("Erreur lors de la validation de la commande.");
      }
    }

    submitBtn.addEventListener("click", addOrder);

    // 2. Écouter la base de données en temps réel
    const q = query(ordersRef, orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      ordersList.innerHTML = "";

      if (snapshot.empty) {
        ordersList.innerHTML = '<li class="empty-msg">Aucune commande en cours.</li>';
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const id = docSnap.id;

        const li = document.createElement("li");
        li.className = "order-item";

        const span = document.createElement("span");
        span.className = "order-text";
        span.textContent = data.texte;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.innerHTML = "&times;";
        deleteBtn.title = "Marquer comme passée";
        deleteBtn.addEventListener("click", () => removeOrder(id));

        li.appendChild(span);
        li.appendChild(deleteBtn);
        ordersList.appendChild(li);
      });
    });

    // 3. Supprimer une commande
    async function removeOrder(id) {
      try {
        await deleteDoc(doc(db, "commandes", id));
      } catch (error) {
        console.error("Erreur lors de la suppression : ", error);
      }
    }
  </script>
</body>
</html>
